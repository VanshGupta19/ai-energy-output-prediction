# config/model_config.yaml
# Hyperparameters for MLP-LSTM, Residual Booster, Baselines, and Uncertainty

mlp_lstm:
  sequence_length: 24 # Lookback window (hours)
  mlp_hidden_dims: [64, 32]
  lstm_units: 64
  lstm_layers: 1
  bidirectional: false
  dense_output_dims: [32, 16]
  dropout: 0.2
  activation: "relu"
  learning_rate: 0.001
  weight_decay: 0.00001
  batch_size: 64
  epochs: 100
  early_stopping_patience: 12
  lr_reduce_patience: 5
  lr_reduce_factor: 0.5
  min_lr: 0.00001

residual_boosting:
  model_type: "xgboost" # "xgboost", "lightgbm", or "hist_gradient_boosting"
  n_estimators: 150
  max_depth: 5
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  early_stopping_rounds: 15

baselines:
  arima:
    order: [2, 1, 1]
    seasonal_order: [1, 0, 0, 24] # Seasonal 24h cycle
    max_train_samples: 2000 # Limit historical length for fast fitting
  svr:
    kernel: "rbf"
    C: 10.0
    epsilon: 0.1
    gamma: "scale"
  standalone_lstm:
    sequence_length: 24
    lstm_units: 64
    lstm_layers: 2
    dropout: 0.2
    learning_rate: 0.001
    epochs: 80
    batch_size: 64
    early_stopping_patience: 10
  transformer:
    sequence_length: 24
    d_model: 32
    nhead: 4
    num_encoder_layers: 2
    dim_feedforward: 64
    dropout: 0.1
    learning_rate: 0.001
    epochs: 80
    batch_size: 64
    early_stopping_patience: 10

uncertainty:
  method: "conformal_prediction" # "conformal_prediction" or "residual_quantile"
  confidence_level: 0.90 # 90% prediction interval target
  calibration_split: 0.5 # Split of validation set used for calibration vs validation
